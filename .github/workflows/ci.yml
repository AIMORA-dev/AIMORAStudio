name: Native Studio CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AIMORA_QT_VERSION: "6.11.2"

jobs:
  source-contract:
    name: Source-tree contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify native repository structure
        run: |
          cmake -DAIMORA_SOURCE_DIR="${GITHUB_WORKSPACE}" -P cmake/VerifySourceTree.cmake
          git diff --check

  native-build:
    name: ${{ matrix.os }} native build
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install exact Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.AIMORA_QT_VERSION }}
          target: desktop
          cache: true
          setup-python: true
          aqtversion: "==3.3.*"
      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DAIMORA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run native foundation smoke command
        run: cmake --build build --config Release --target aimora_studio_smoke
      - name: Verify install tree
        run: cmake --install build --config Release --prefix staging

  quality:
    name: Formatting and clang-tidy
    needs: source-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install exact Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.AIMORA_QT_VERSION }}
          target: desktop
          cache: true
          setup-python: true
          aqtversion: "==3.3.*"
      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy
      - name: Check deterministic formatting
        run: cmake -DAIMORA_SOURCE_DIR="${GITHUB_WORKSPACE}" -P cmake/VerifyFormatting.cmake
      - name: Configure clang-tidy build
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-quality
          -DBUILD_TESTING=ON
          -DAIMORA_WARNINGS_AS_ERRORS=ON
          -DAIMORA_ENABLE_CLANG_TIDY=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build with clang-tidy
        run: cmake --build build-quality --parallel
      - name: Test quality build
        run: ctest --test-dir build-quality --output-on-failure

  sanitizers:
    name: ASan and UBSan
    needs: source-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install exact Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: ${{ env.AIMORA_QT_VERSION }}
          target: desktop
          cache: true
          setup-python: true
          aqtversion: "==3.3.*"
      - name: Configure sanitizer build
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitizers
          -DBUILD_TESTING=ON
          -DAIMORA_WARNINGS_AS_ERRORS=ON
          -DAIMORA_ENABLE_SANITIZERS=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build sanitizer targets
        run: cmake --build build-sanitizers --parallel
      - name: Test sanitizer build
        env:
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitizers --output-on-failure
