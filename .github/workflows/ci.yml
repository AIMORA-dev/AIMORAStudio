name: Studio CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: AIMORA-dev/.github/.github/workflows/node-smoke.yml@c4eea2f0d3237419875db67a8c8d8752fce790cd
    with:
      runner: ${{ matrix.os }}
      node-version: '22'
      test-command: npm test
