name: Studio architecture contract

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Native architecture on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Verify the GUI010 native architecture freeze
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f ARCHITECTURE.md
          test -f README.md
          test -f CONTRIBUTING.md
          grep -Fq 'C++20' ARCHITECTURE.md
          grep -Fq 'Qt 6.11.2' ARCHITECTURE.md
          grep -Fq 'CMake 3.28' ARCHITECTURE.md
          grep -Fq 'out-of-process Julia' README.md
          grep -Fq 'does not claim that the native application is already implemented' ARCHITECTURE.md
          grep -Fq 'retained as history until `GUI020`' CONTRIBUTING.md
          grep -Fq 'Do not add Electron' CONTRIBUTING.md
          grep -Fq 'Do not make SVG the canonical symbol' CONTRIBUTING.md
          test ! -e CMakeLists.txt
          test ! -d src
          test ! -d apps
          echo 'GUI010 architecture-only contract passed; GUI020 owns the native CMake implementation.'
